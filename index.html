var UNC=["Countess-sjanser = vanilla-tall (d2runes.io). Tabell bekreftet uendret i PD2.","Quest-belønninger fra vanilla.","Teleport-stav < lvl 24: Ezos tips, ikke testet.","Key-pris og 9+1-stabling ikke sjekket i PD2.","CTA-base «2ax» (Double Axe?)."];
var SRC=[["Ezos build (hiimpd2)","https://hiimpd2.com/b/MdvmHaz"],["Ezos dokument","https://docs.google.com/document/d/1UbReGCNhqeYQIgYA8ihOyGuGJ1u_lBafCK7IX9wzHIs"],["PD2 Recipes","https://wiki.projectdiablo2.com/wiki/Recipes"],["PD2 Runes","https://wiki.projectdiablo2.com/wiki/Runes"],["PD2 Monsters (Countess)","https://wiki.projectdiablo2.com/wiki/Monsters"]];

var KEY="pd2-s14-ezo-magic-arrow-v1",UIK=KEY+"-ui";
function ld(k,d){try{var s=localStorage.getItem(k);return s?JSON.parse(s):d;}catch(e){return d;}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var st=ld(KEY,{done:{},hist:[]});if(!st||typeof st!=="object")st={};st.done=st.done||{};st.hist=st.hist||[];
var ui=ld(UIK,{});if(!ui||typeof ui!=="object")ui={};ui.filter=ui.filter||"alle";ui.lvl=ui.lvl||3;ui.gear=ui.gear||0;
var open={};
function save(){sv(KEY,st);sv(UIK,ui);}
function $(i){return document.getElementById(i);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function cur(){for(var i=0;i<STEPS.length;i++)if(!st.done[STEPS[i].id])return STEPS[i];return null;}
function goal(){for(var i=0;i<GOALS.length;i++)if(!st.done[GOALS[i][0]])return GOALS[i];return null;}
function gateNext(){for(var i=0;i<STEPS.length;i++)if(STEPS[i].gate&&!st.done[STEPS[i].id])return STEPS[i];return null;}
function msg(t){$("msg").textContent=t;setTimeout(function(){if($("msg").textContent===t)$("msg").textContent="";},3000);}
function tog(id){st.done[id]=!st.done[id];if(st.done[id])st.hist.push(id);else st.hist=st.hist.filter(function(x){return x!==id;});st.hist=st.hist.slice(-200);save();render();}
function top(){
 var c=cur(),g=goal(),gt=gateNext(),n=0;STEPS.forEach(function(s){if(st.done[s.id])n++;});
 $("nx").textContent=c?c.line:"Ferdig!";$("nx").title=c?c.zone+" · lvl "+c.lvl:"";
 $("goal").innerHTML=g?'<b style="color:var(--t)">'+esc(g[1])+'</b> <span class="lb">— '+esc(g[2])+'</span>':"–";
 var gi=gt?STEPS.indexOf(gt):-1,ci=c?STEPS.indexOf(c):-1;
 if(gt&&gi-ci<=6){$("gateLn").style.display="flex";$("gate").textContent=(gi===ci?"⛔ NÅ: ":"⛔ Snart: ")+gt.line.replace("⛔ ","")+(gi===ci?" (▸ i lista)":"");}else $("gateLn").style.display="none";
 $("lvT").textContent="Lvl "+ui.lvl+": "+adv(ui.lvl);
 $("bar").style.width=Math.round(n/STEPS.length*100)+"%";
 $("cnt").textContent=n+"/"+STEPS.length;
 $("bHide").className=ui.hide?"on":"";
}
function list(){
 var c=cur(),h="",last="";
 STEPS.forEach(function(s){
  if(ui.filter!=="alle"&&String(s.stage)!==ui.filter)return;
  var d=!!st.done[s.id];if(ui.hide&&d)return;
  if(s.zone!==last){h+='<div class="z">'+esc(s.zone)+'</div>';last=s.zone;}
  var hasDet=s.det||s.runes;
  h+='<div class="s'+(s.gate?' gt':'')+(d?' dn':'')+(c&&c.id===s.id?' cur':'')+(open[s.id]?' open':'')+'" id="step-'+s.id+'" data-id="'+s.id+'">'+
   '<div class="h"><span class="cb">'+(d?'✓':'')+'</span><span class="tx">'+esc(s.line)+'</span><span class="lv">'+s.lvl+'</span>'+(hasDet?'<span class="ex" data-ex="1">'+(open[s.id]?'▾':'▸')+'</span>':'')+'</div>'+
   (hasDet?'<div class="det">'+(s.gate?s.det:esc(s.det))+(s.runes?(s.det?'<br>':'')+'<span class="rn">'+esc(s.runes.join(" "))+'</span>':'')+'</div>':'')+'</div>';
 });
 $("steps").innerHTML=h;
 var f=[["alle","Alle"],["0","Normal"],["1","NM"],["2","Hell"],["3","Maps"],["4","End"]];
 $("flt").innerHTML=f.map(function(o){return'<button data-f="'+o[0]+'" class="'+(ui.filter===o[0]?'on':'')+'">'+o[1]+'</button>';}).join("");
}
function render(){top();list();}
function tbl(rows,head){return(head?'<tr>'+head.map(function(x){return'<th>'+x+'</th>';}).join("")+'</tr>':'')+rows.map(function(r){return'<tr>'+r.map(function(x){return'<td>'+esc(x)+'</td>';}).join("")+'</tr>';}).join("");}
function gear(){$("gT").innerHTML=GEAR.map(function(g,i){return'<button data-g="'+i+'" class="'+(ui.gear===i?'on':'')+'">'+g[0]+'</button>';}).join("");$("tGear").innerHTML=tbl(GEAR[ui.gear][1]);}
function stat(){
 $("tLvl").innerHTML=tbl(LVL,["Lvl","5 stat","1 skill"]);
 $("tRw").innerHTML=tbl(RW,["Runeord","Runer","Base","Lvl"]);
 function ul(id,a){$(id).innerHTML=a.map(function(t){return'<li>'+esc(t)+'</li>';}).join("");}
 ul("lKeys",KEYS);ul("lTips",TIPS);ul("lUnc",UNC);
 $("lSrc").innerHTML=SRC.map(function(s){return'<li><a href="'+s[1]+'" target="_blank" rel="noopener">'+esc(s[0])+'</a></li>';}).join("");
 gear();
}
$("steps").addEventListener("click",function(e){var el=e.target.closest(".s");if(!el)return;var id=el.getAttribute("data-id");
 if(e.target.closest("[data-ex]")||e.target.closest(".det")){open[id]=!open[id];list();return;}tog(id);});
$("flt").addEventListener("click",function(e){var b=e.target.closest("button");if(b){ui.filter=b.getAttribute("data-f");save();list();}});
$("gT").addEventListener("click",function(e){var b=e.target.closest("button");if(b){ui.gear=+b.getAttribute("data-g");save();gear();}});
$("bOk").onclick=function(){var c=cur();if(c)tog(c.id);};
$("bUndo").onclick=function(){var id=st.hist.pop();if(id){st.done[id]=false;save();render();msg("Angret");}};
$("bMenu").onclick=function(){$("menu").classList.toggle("on");};
$("bJump").onclick=function(){var c=cur();if(!c)return;ui.filter="alle";ui.hide=false;save();render();var el=$("step-"+c.id);if(el&&el.scrollIntoView)el.scrollIntoView({block:"center"});};
$("bHide").onclick=function(){ui.hide=!ui.hide;save();render();};
$("bReset").onclick=function(){if(confirm("Nullstille alt?")){st={done:{},hist:[]};save();render();}};
$("bExp").onclick=function(){var c=JSON.stringify({v:1,done:Object.keys(st.done).filter(function(k){return st.done[k];})});var io=$("io");io.style.display="block";io.value=c;io.select();try{document.execCommand("copy");}catch(e){}if(navigator.clipboard)navigator.clipboard.writeText(c).catch(function(){});msg("Kopiert");};
$("bImp").onclick=function(){var io=$("io");if(io.style.display!=="block"||!io.value.trim()){io.style.display="block";io.value="";io.focus();msg("Lim inn, trykk Importer");return;}
 try{var d=JSON.parse(io.value.trim()),l=Array.isArray(d)?d:d.done;if(!Array.isArray(l))throw 0;var ok={};STEPS.forEach(function(s){ok[s.id]=1;});var nd={},n=0;l.forEach(function(i){if(ok[i]){nd[i]=true;n++;}});st={done:nd,hist:[]};save();render();io.style.display="none";msg("Importert "+n);}catch(e){msg("Ugyldig kode");}};
function setLv(v){ui.lvl=Math.max(1,Math.min(99,v));save();top();}
$("lvM").onclick=function(){setLv(ui.lvl-1);};$("lvP").onclick=function(){setLv(ui.lvl+1);};
window.addEventListener("storage",function(e){if(e.key===KEY){st=ld(KEY,st);render();}});
window.__pd2={state:function(){return st;},current:cur,nextGoal:goal,nextGate:gateNext,KEY:KEY,STEPS:STEPS};
stat();render();
})();
</script>
</body>
</html>
